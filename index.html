<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CalhaPro em manutenção</title>
<meta name="description" content="O CalhaPro está temporariamente em manutenção. Voltamos em breve.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231E40AF'/%3E%3Cpath d='M7 9h3v13h13v-9h-3' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8FAFC; --ink:#0F172A; --muted:#64748B; --blue:#1E40AF;
  --grid:rgba(30,64,175,.06); --grid-strong:rgba(30,64,175,.12);
  --edge:rgba(30,64,175,.28); --card:rgba(255,255,255,.72); --water:rgba(30,64,175,.20);
  --green:#22C55E; --green-ink:#052E16;
  --f-display:"Plus Jakarta Sans","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F172A; --ink:#E2E8F0; --muted:#94A3B8; --blue:#60A5FA;
    --grid:rgba(96,165,250,.07); --grid-strong:rgba(96,165,250,.14);
    --edge:rgba(96,165,250,.32); --card:rgba(15,23,42,.6); --water:rgba(96,165,250,.30);
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100dvh; color:var(--ink); background-color:var(--bg);
  font:400 1rem/1.6 var(--f-body); -webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    linear-gradient(var(--grid-strong) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-strong) 1px,transparent 1px);
  background-size:24px 24px,24px 24px,120px 120px,120px 120px;
}
.page{
  width:100%; max-width:1200px; min-height:100dvh; margin:0 auto;
  display:grid; grid-template-rows:auto 1fr auto;
  padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
}
header{display:flex;align-items:center;gap:10px;padding-block:8px}
.brand{font:800 1.25rem/1 var(--f-display);letter-spacing:-.02em}
main{
  display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);
  gap:clamp(32px,6vw,80px); align-items:center; padding-block:clamp(24px,5vw,64px);
}
h1{
  margin:0 0 20px; font:800 clamp(2.1rem,4.8vw,3.5rem)/1.05 var(--f-display);
  letter-spacing:-.03em; text-wrap:balance;
}
.lead{margin:0 0 32px;max-width:46ch;font-size:1.0625rem;color:var(--muted)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;
  border:0;border-radius:10px;background:var(--green);color:var(--green-ink);
  font:600 1rem/1 var(--f-body);cursor:pointer;transition:filter .15s,transform .15s;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* legenda de prancha */
.legend{margin:40px 0 0;max-width:420px;border:1px solid var(--edge);background:var(--card);font-size:.9375rem}
.legend div{display:grid;grid-template-columns:96px 1fr;border-top:1px solid var(--edge)}
.legend div:first-child{border-top:0}
.legend dt,.legend dd{margin:0;padding:10px 14px}
.legend dt{color:var(--muted);border-right:1px solid var(--edge)}
.legend dd{font-weight:500;overflow-wrap:anywhere}
.legend a{color:var(--blue);text-underline-offset:3px}
.dot{display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--blue);vertical-align:1px}

/* desenho */
.sheet{position:relative;border:1px solid var(--edge);background:var(--card)}
.sheet::before,.sheet::after{content:"";position:absolute;width:18px;height:18px;border:0 solid var(--blue)}
.sheet::before{top:-1px;left:-1px;border-top-width:3px;border-left-width:3px}
.sheet::after{right:-1px;bottom:-1px;border-bottom-width:3px;border-right-width:3px}
svg{display:block;width:100%;height:auto}
#sheet{fill:none;stroke:var(--blue);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
#waterRect{fill:var(--water)}
#waterTop{stroke:var(--blue);stroke-width:1.5;opacity:.55}
.dim line,.dim path{stroke:var(--muted);stroke-width:1.2;fill:none}
.dim .ext{stroke-dasharray:3 3;opacity:.7}
.dim text{fill:var(--muted);font:500 12px var(--f-mono)}
.controls{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:12px 16px;border-top:1px solid var(--edge);
}
.steps{display:flex;gap:20px;margin:0;padding:0;list-style:none;counter-reset:s;font-size:.875rem;color:var(--muted)}
.steps li{counter-increment:s;padding-bottom:2px;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.steps li::before{content:counter(s) ". "}
.steps li.done{color:var(--ink)}
.steps li.on{color:var(--blue);font-weight:600;border-color:var(--blue)}
.link{
  min-height:44px;padding:0 4px;border:0;background:none;color:var(--blue);
  font:500 .875rem/1 var(--f-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;
}
footer{padding-block:8px;color:var(--muted);font-size:.875rem}

@media (max-width:860px){
  main{grid-template-columns:1fr;gap:40px}
  .lead{margin-bottom:28px}
  .legend{margin-top:32px;max-width:none}
}
@media (max-width:420px){
  .legend div{grid-template-columns:84px 1fr}
  .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <header>
    <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1E40AF"/><path d="M7 9h3v13h13v-9h-3" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="brand">CalhaPro</span>
  </header>

  <main>
    <section>
      <h1>Estamos ajustando o CalhaPro.</h1>
      <p class="lead">A plataforma está fora do ar por um período curto, para uma atualização. Volte em alguns minutos: assim que terminarmos, tudo estará de volta.</p>
      <button class="btn" type="button" id="retry">Tentar novamente</button>

      <dl class="legend">
        <div><dt>Projeto</dt><dd>CalhaPro</dd></div>
        <div><dt>Status</dt><dd><span class="dot" aria-hidden="true"></span>Em manutenção</dd></div>
        <div><dt>Retorno</dt><dd id="retorno">Em breve</dd></div>
        <div id="rowContato" hidden><dt>Contato</dt><dd><a id="contato" href="#"></a></dd></div>
      </dl>
    </section>

    <figure class="sheet" style="margin:0">
      <svg id="art" viewBox="0 0 640 330" role="img" aria-label="Uma chapa metálica plana é medida, dobrada até virar o perfil de uma calha e, por fim, recebe água para teste.">
        <defs><clipPath id="clip"><path id="clipPath" d=""/></clipPath></defs>
        <g clip-path="url(#clip)">
          <rect id="waterRect" x="150" width="340" y="248" height="0"/>
          <line id="waterTop" x1="150" x2="490" y1="248" y2="248"/>
        </g>
        <path id="sheet" d=""/>

        <g class="dim" id="dimFlat">
          <line id="fdLine" x1="0" x2="0" y1="290" y2="290"/>
          <line id="fdT1" y1="284" y2="296"/>
          <line id="fdT2" y1="284" y2="296"/>
          <text id="fdText" y="312" text-anchor="middle"></text>
        </g>

        <g class="dim" id="dimBend" opacity="0">
          <line class="ext" x1="200" x2="200" y1="256" y2="292"/>
          <line class="ext" x1="470" x2="470" y1="256" y2="292"/>
          <line x1="200" x2="470" y1="290" y2="290"/>
          <line x1="200" x2="200" y1="284" y2="296"/>
          <line x1="470" x2="470" y1="284" y2="296"/>
          <text x="335" y="312" text-anchor="middle">abertura 270 mm</text>

          <line class="ext" x1="128" x2="158" y1="90" y2="90"/>
          <line class="ext" x1="128" x2="198" y1="250" y2="250"/>
          <line x1="132" x2="132" y1="90" y2="250"/>
          <line x1="126" x2="138" y1="90" y2="90"/>
          <line x1="126" x2="138" y1="250" y2="250"/>
          <text x="122" y="174" text-anchor="end">160 mm</text>
        </g>
      </svg>

      <div class="controls">
        <ol class="steps" id="steps">
          <li>Medir</li><li>Dobrar</li><li>Testar</li>
        </ol>
        <button class="link" type="button" id="replay">Ver de novo</button>
      </div>
    </figure>
  </main>

  <footer>CalhaPro, gestão para empresas de calhas e rufos.</footer>
</div>

<script>
/* ============ CONFIGURAÇÃO (edite aqui) ============
   retorno: data/hora prevista, ex.: "2026-09-21T14:00:00-03:00" (ou null para "Em breve")
   email:   contato de suporte, ex.: "contato@calhapro.com.br" (ou "" para ocultar)         */
var CONFIG = { retorno: null, email: "" };
/* =================================================== */

(function () {
  document.getElementById("retry").addEventListener("click", function () { location.reload(); });

  var rEl = document.getElementById("retorno");
  if (CONFIG.retorno) {
    var d = new Date(CONFIG.retorno);
    if (!isNaN(d)) {
      rEl.textContent = d > new Date()
        ? d.toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short", timeZone: "America/Sao_Paulo" })
        : "Em instantes";
    }
  }
  if (CONFIG.email) {
    var a = document.getElementById("contato");
    a.textContent = CONFIG.email;
    a.href = "mailto:" + CONFIG.email;
    document.getElementById("rowContato").hidden = false;
  }

  /* ---------- geometria ---------- */
  function dist(a, b) { return Math.hypot(b[0] - a[0], b[1] - a[1]); }
  function roundPoly(v, r) {
    var out = [v[0]];
    for (var i = 1; i < v.length - 1; i++) {
      var a = v[i - 1], p = v[i], b = v[i + 1];
      var ra = Math.min(r, dist(a, p) / 2), rb = Math.min(r, dist(p, b) / 2);
      var da = dist(a, p), db = dist(p, b);
      var s = [p[0] + (a[0] - p[0]) / da * ra, p[1] + (a[1] - p[1]) / da * ra];
      var e = [p[0] + (b[0] - p[0]) / db * rb, p[1] + (b[1] - p[1]) / db * rb];
      for (var k = 0; k <= 10; k++) {
        var t = k / 10, u = 1 - t;
        out.push([u * u * s[0] + 2 * u * t * p[0] + t * t * e[0], u * u * s[1] + 2 * u * t * p[1] + t * t * e[1]]);
      }
    }
    out.push(v[v.length - 1]);
    return out;
  }
  function polyLen(pts) { var L = 0; for (var i = 1; i < pts.length; i++) L += dist(pts[i - 1], pts[i]); return L; }
  function resample(pts, n) {
    var total = polyLen(pts), out = [], seg = 1, acc = 0;
    for (var k = 0; k < n; k++) {
      var target = total * k / (n - 1);
      while (seg < pts.length - 1 && acc + dist(pts[seg - 1], pts[seg]) < target) { acc += dist(pts[seg - 1], pts[seg]); seg++; }
      var a = pts[seg - 1], b = pts[seg], sl = dist(a, b) || 1;
      var f = Math.min(1, Math.max(0, (target - acc) / sl));
      out.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]);
    }
    return out;
  }
  function pathD(pts) { return "M" + pts.map(function (p) { return p[0].toFixed(1) + " " + p[1].toFixed(1); }).join("L"); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(x) { return Math.min(1, Math.max(0, x)); }
  function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  var N = 120;
  var profile = [[160, 90], [200, 90], [200, 250], [470, 250], [470, 120], [440, 120]];
  var target = resample(roundPoly(profile, 18), N);
  var L = polyLen(target);
  var x0 = 320 - L / 2, x1 = 320 + L / 2;
  var flat = [];
  for (var i = 0; i < N; i++) flat.push([lerp(x0, x1, i / (N - 1)), 250]);

  var sheet = document.getElementById("sheet");
  document.getElementById("clipPath").setAttribute("d", pathD(target) + "Z");

  var fdLine = document.getElementById("fdLine"), fdT1 = document.getElementById("fdT1"),
      fdT2 = document.getElementById("fdT2"), fdText = document.getElementById("fdText"),
      dimFlat = document.getElementById("dimFlat"), dimBend = document.getElementById("dimBend"),
      wRect = document.getElementById("waterRect"), wTop = document.getElementById("waterTop"),
      steps = document.querySelectorAll("#steps li");

  fdT1.setAttribute("x1", x0); fdT1.setAttribute("x2", x0);
  fdT2.setAttribute("x1", x1); fdT2.setAttribute("x2", x1);
  fdLine.setAttribute("x1", x0);
  fdText.setAttribute("x", 320);
  fdText.textContent = "chapa " + Math.round(L) + " mm";

  var T_MEASURE = 900, T_BEND = 1800, T_WATER = 1800, GAP = 200, TOTAL = T_MEASURE + T_BEND + GAP + T_WATER;
  var WATER_MAX = 62, lastStep = -1;

  function setStep(idx) {
    if (idx === lastStep) return;
    lastStep = idx;
    steps.forEach(function (li, i) {
      li.className = i < idx ? "done" : i === idx ? "on" : "";
      if (i === idx) li.setAttribute("aria-current", "step"); else li.removeAttribute("aria-current");
    });
  }

  function render(t) {
    var m = clamp(t / T_MEASURE);
    var b = ease(clamp((t - T_MEASURE) / T_BEND));
    var w = ease(clamp((t - T_MEASURE - T_BEND - GAP) / T_WATER));

    var pts = [];
    for (var i = 0; i < N; i++) pts.push([lerp(flat[i][0], target[i][0], b), lerp(flat[i][1], target[i][1], b)]);
    sheet.setAttribute("d", pathD(pts));

    fdLine.setAttribute("x2", lerp(x0, x1, m));
    dimFlat.setAttribute("opacity", (m * (1 - clamp(b * 5))).toFixed(3));
    dimBend.setAttribute("opacity", clamp((b - .8) / .2).toFixed(3));

    var h = WATER_MAX * w;
    wRect.setAttribute("y", 248 - h); wRect.setAttribute("height", h + 2);
    wTop.setAttribute("y1", 248 - h); wTop.setAttribute("y2", 248 - h);
    wTop.style.opacity = h > 0.5 ? .55 : 0;

    setStep(t < T_MEASURE ? 0 : t < T_MEASURE + T_BEND + GAP ? 1 : 2);
  }

  var raf = 0, token = 0;
  function play() {
    cancelAnimationFrame(raf);
    var my = ++token, start = performance.now();
    render(0);
    raf = requestAnimationFrame(function tick(now) {
      if (my !== token) return;
      var t = Math.max(0, now - start);
      if (t >= TOTAL) { render(TOTAL); return; }
      render(t);
      raf = requestAnimationFrame(tick);
    });
  }

  var replay = document.getElementById("replay");
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    render(TOTAL);
    replay.hidden = true;
  } else {
    render(0);
    play();
    replay.addEventListener("click", play);
  }
})();
</script>
</body>
</html>
